name: Render Keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-slim
    steps:
      - name: Ping Render MCP
        run: |
          set -e
          curl --fail --silent --show-error --max-time 20             https://binance-square-mcp.onrender.com/ping
